services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: numenor-postgres-prod
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - numenor-network
    restart: unless-stopped
    # Security: Don't expose database port in production
    # ports:
    #   - "5432:5432"

  # Redis for caching and session storage
  redis:
    image: redis:7-alpine
    container_name: numenor-redis-prod
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - numenor-network
    restart: unless-stopped
    # Security: Don't expose Redis port in production
    # ports:
    #   - "6379:6379"

  # Numenor Security Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numenor-app-prod
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      
      # Application Configuration
      NODE_ENV: production
      API_PORT: 3000
      
      # Security (use environment variables)
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_SECRET: ${TOKEN_SECRET}
      
      # Email Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      
      # WHOIS API Configuration (from .env file)
      WHOIS_JSON_API_KEY: ${WHOIS_JSON_API_KEY}
      WHOIS_XML_API_KEY: ${WHOIS_XML_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - numenor-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Resource limits for production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Database Migration Service (runs once)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: numenor-migrate-prod
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - numenor-network
    command: ["npm", "run", "db:migrate"]
    restart: "no"

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: numenor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - numenor-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  numenor-network:
    driver: bridge
