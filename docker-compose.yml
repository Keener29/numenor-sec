services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: numenor-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-numenor_security}
      POSTGRES_USER: ${DB_USER:-numenor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-} # Require DB_PASSWORD env var (no default)
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U numenor_user -d numenor_security"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - numenor-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: numenor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - numenor-network

  # Numenor Security API
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: numenor-api
    environment:
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: numenor_security
      DB_USER: numenor_user
      DB_PASSWORD: numenor_password

      # Application Configuration
      NODE_ENV: development
      API_PORT: ${API_PORT}

      # Security (from .env file)
      JWT_SECRET: ${JWT_SECRET}
      TOKEN_SECRET: ${TOKEN_SECRET}

      # Email Configuration (from .env file)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      PROCESSED_EMAIL_RETENTION_HOURS: ${PROCESSED_EMAIL_RETENTION_HOURS}

      # Gmail OAuth Configuration (from .env file)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${VITE_API_URL}
      PUBSUB_WEBHOOK_URL: ${PUBSUB_WEBHOOK_URL}

      GOOGLE_CLOUD_PROJECT_ID: ${GOOGLE_CLOUD_PROJECT_ID}
      GMAIL_PUBSUB_TOPIC: ${GMAIL_PUBSUB_TOPIC}
      GMAIL_PUBSUB_SUBSCRIPTION: ${GMAIL_PUBSUB_SUBSCRIPTION}

      # Microsoft/Azure OAuth Configuration (from .env file)
      AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET}
      AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI}
      MICROSOFT_CLIENT_STATE_SECRET: ${MICROSOFT_CLIENT_STATE_SECRET}
      MICROSOFT_SUBSCRIPTION_EXPIRATION_HOURS: ${MICROSOFT_SUBSCRIPTION_EXPIRATION_HOURS:-72}
      MICROSOFT_SUBSCRIPTION_RENEWAL_THRESHOLD_HOURS: ${MICROSOFT_SUBSCRIPTION_RENEWAL_THRESHOLD_HOURS:-24}

      # WHOIS API Configuration (from .env file)
      WHOIS_JSON_API_KEY: ${WHOIS_JSON_API_KEY}
      WHOIS_XML_API_KEY: ${WHOIS_XML_API_KEY}
    ports:
      - "3001:3001"
    volumes:
      - ./app:/app/app:ro # Mount source code for development
      - ./logs:/app/logs # Mount logs directory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - numenor-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Numenor Security Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
        VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
        VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI}
    container_name: numenor-frontend
    environment:
      NODE_ENV: development
      DOCKER_API_URL: http://api:3001/api
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      VITE_AZURE_CLIENT_ID: ${VITE_AZURE_CLIENT_ID}
      VITE_AZURE_REDIRECT_URI: ${VITE_AZURE_REDIRECT_URI}
    ports:
      - "3000:3000"
    volumes:
      - ./app:/app/app:ro # Mount source code for development
    depends_on:
      api:
        condition: service_healthy
    networks:
      - numenor-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Database Migration Service
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: numenor-migrate
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: numenor_security
      DB_USER: numenor_user
      DB_PASSWORD: numenor_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - numenor-network
    command: ["npm", "run", "db:migrate"]
    restart: "no"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  numenor-network:
    driver: bridge
