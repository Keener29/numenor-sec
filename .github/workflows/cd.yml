name: CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/numenor

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - api
          - frontend
          - migrate
        include:
          - service: api
            dockerfile: ./Dockerfile.api
          - service: frontend
            dockerfile: ./Dockerfile
          - service: migrate
            dockerfile: ./Dockerfile.migrate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push image
        id: buildpush
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.service == 'frontend' && format('VITE_GOOGLE_CLIENT_ID=${{{{ secrets.VITE_GOOGLE_CLIENT_ID }}}}')}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        id: digest
        run: echo "digest=${{ steps.buildpush.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Append Summary
        run: |
          echo "### 📦 ${{ matrix.service }} Image" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.meta.outputs.tags }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:**" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ steps.digest.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

  finalize:
    name: Final Deployment Output
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Final Summary
        run: |
          echo "## 🚀 Images Successfully Published to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Update your Render/Railway service to point to the new image digests." >> $GITHUB_STEP_SUMMARY
          echo "Digest-based deployments ensure immutability and atomic rollouts." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Done."
